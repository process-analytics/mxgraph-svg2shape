name: Build

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/workflows/release-drafter.yml'
      - '.gitignore'
      - '*.md'
      - LICENSE
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '.github/workflows/release-drafter.yml'
      - '.gitignore'
      - '*.md'
      - LICENSE

jobs:
  build:
    runs-on: ${{ matrix.os.name }}
    strategy:
      # we want to run the full build on all os: don't cancel running jobs even if one fails
      fail-fast: false
      matrix:
        os:
          - { name: ubuntu-24.04 }
          - { name: macos-14 }
          - { name: windows-22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v2
        with:
          distribution: ''
          java-version: 1.8
      - name: build
        run: |
          ./mvnw -V package
